name: Extract app source
on:
  push:
    branches: [main]
    paths:
      - "ya-ghoni-outlet-android-source.zip"
      - ".github/workflows/extract-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract project files
        run: |
          mkdir -p /tmp/ya-ghoni
          unzip -q ya-ghoni-outlet-android-source.zip -d /tmp/ya-ghoni
          test -d /tmp/ya-ghoni/ya-ghoni-work
          cp -a /tmp/ya-ghoni/ya-ghoni-work/. .
          rm -f ya-ghoni-outlet-android-source.zip
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Ya Ghoni Outlet app source"
            git push
          fi
