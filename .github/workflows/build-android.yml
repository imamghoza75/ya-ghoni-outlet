name: Build Ya Ghoni Outlet APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor
        run: npm install --no-save --no-audit --no-fund @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Build web application
        run: npm run build

      - name: Create Android project
        run: npx cap add android
        env:
          CAPACITOR_SERVER_URL: https://ya-ghoni-outlet-hubs.vercel.app

      - name: Sync Android project
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: https://ya-ghoni-outlet-hubs.vercel.app

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ya-ghoni-outlet-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
